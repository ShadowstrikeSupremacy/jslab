<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 6 - Array Operations</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 650px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    h1 { font-size: 22px; text-align: center; }
    h3 { margin-bottom: 5px; }
    .section { border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    input { padding: 6px; margin: 4px 0; width: 200px; }
    button { padding: 6px 14px; margin: 4px 2px; cursor: pointer; }
    .result { margin-top: 8px; padding: 8px; background: #eef; border: 1px solid #99c; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Array Operations</h1>

    <div class="section">
      <h3>Create Array</h3>
      Array length: <input type="number" id="arrLength"><br>
      Elements (comma separated): <input type="text" id="arrElements"><br>
      <button onclick="createArray()">Create Array</button>
      <div class="result" id="arrayResult"></div>
    </div>

    <div class="section">
      <h3>1. Remove a Specific Element</h3>
      Element to remove: <input type="text" id="removeValue"><br>
      <button onclick="removeWithMethods()">Using Array Methods</button>
      <button onclick="removeWithoutMethods()">Without Array Methods</button>
      <div class="result" id="removeResult"></div>
    </div>

    <div class="section">
      <h3>2. Check if Array Contains a Value</h3>
      Value to search: <input type="text" id="searchValue"><br>
      <button onclick="containsWithMethods()">Using Array Methods</button>
      <button onclick="containsWithoutMethods()">Without Array Methods</button>
      <div class="result" id="containsResult"></div>
    </div>

    <div>
      <h3>3. Empty the Array</h3>
      <button onclick="emptyWithMethods()">Using Array Methods</button>
      <button onclick="emptyWithoutMethods()">Without Array Methods</button>
      <div class="result" id="emptyResult"></div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
