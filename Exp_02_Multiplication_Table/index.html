<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 2 - Multiplication Table</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 700px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    h1 { font-size: 22px; }
    input { padding: 6px; width: 150px; }
    button { padding: 6px 14px; margin: 4px 2px; cursor: pointer; }
    .tables { display: flex; justify-content: space-around; margin-top: 15px; }
    .result h3 { font-size: 15px; margin: 5px; }
    table { border-collapse: collapse; margin: auto; }
    td { border: 1px solid #555; padding: 4px 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Multiplication Table Generator</h1>
    Enter a number: <input type="number" id="numberInput"><br>
    <button onclick="tableUsingForLoop()">Using For Loop</button>
    <button onclick="tableUsingWhileLoop()">Using While Loop</button>
    <button onclick="tableUsingDoWhileLoop()">Using Do-While Loop</button>

    <div class="tables">
      <div class="result" id="forResult"></div>
      <div class="result" id="whileResult"></div>
      <div class="result" id="doWhileResult"></div>
    </div>

  </div>
  <script src="script.js"></script>
  <script src="script_while.js"></script>
</body>
</html>
