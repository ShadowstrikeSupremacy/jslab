<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 8 - Change Home Page Background Color</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #ffffff; margin: 0; }
    header { background: #333; color: #fff; padding: 15px; text-align: center; }
    nav a { color: #fff; margin: 0 10px; text-decoration: none; }
    .container { max-width: 650px; margin: 20px auto; padding: 0 20px; }
    #colorBox { width: 300px; height: 120px; background-color: lightblue; margin: 15px auto;
                display: flex; align-items: center; justify-content: center; border: 1px solid #555; }
    input { padding: 6px; width: 220px; margin: 5px 0; }
    .status { margin-top: 10px; padding: 8px; background: #eee; border: 1px solid #aaa; }
  </style>
</head>
<body id="pageBody">
  <header>
    <h2>My Website</h2>
    <nav><a href="#">Home</a> <a href="#">About</a> <a href="#">Contact</a></nav>
  </header>

  <div class="container">
    <h3>1. On Mouse Over Event</h3>
    <p>Move the mouse over the box to change the background color of the page and the box.</p>
    <div id="colorBox">Mouse over me</div>

    <h3>2. On Focus Event</h3>
    <p>Click inside a text box to change the page background color.</p>
    Name: <input type="text" id="nameField" placeholder="Click here"><br>
    Email: <input type="text" id="emailField" placeholder="Click here">

    <div class="status" id="status">Background color: white</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
