<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 9 - Student Information Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 550px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    h1 { font-size: 22px; text-align: center; }
    .field { margin-bottom: 10px; }
    label { display: inline-block; width: 110px; font-weight: bold; }
    input[type=text], textarea, select { padding: 6px; width: 250px; }
    textarea { vertical-align: top; height: 45px; }
    .error { color: red; font-size: 13px; margin-left: 115px; }
    .invalid { border: 1px solid red; background: #ffecec; }
    button { padding: 8px 20px; margin-top: 10px; cursor: pointer; }
    #welcomePage { display: none; text-align: center; }
    #welcomePage h2 { color: green; }
  </style>
</head>
<body>
  <div class="container">
    <div id="formPage">
      <h1>Student Information Form</h1>
      <form id="studentForm" onsubmit="return validateForm()" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name">
          <div class="error" id="nameError"></div>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <textarea id="address"></textarea>
          <div class="error" id="addressError"></div>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city">
          <div class="error" id="cityError"></div>
        </div>
        <div class="field">
          <label for="state">State</label>
          <select id="state">
            <option value="">-- Select State --</option>
            <option>Maharashtra</option>
            <option>Karnataka</option>
            <option>Gujarat</option>
            <option>Goa</option>
            <option>Tamil Nadu</option>
            <option>Delhi</option>
          </select>
          <div class="error" id="stateError"></div>
        </div>
        <div class="field">
          <label>Gender</label>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female"> Female
          <input type="radio" name="gender" value="Other"> Other
          <div class="error" id="genderError"></div>
        </div>
        <div class="field">
          <label for="mobile">Mobile No.</label>
          <input type="text" id="mobile" maxlength="10">
          <div class="error" id="mobileError"></div>
        </div>
        <div class="field">
          <label for="email">Email ID</label>
          <input type="text" id="email">
          <div class="error" id="emailError"></div>
        </div>
        <div style="text-align:center">
          <button type="submit">Submit</button>
          <button type="reset" onclick="clearErrors()">Reset</button>
        </div>
      </form>
    </div>

    <div id="welcomePage">
      <h2>Congratulations!</h2>
      <h3 id="welcomeText"></h3>
      <div id="summary"></div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
