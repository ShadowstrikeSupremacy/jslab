<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 4 - String Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    h1 { font-size: 22px; text-align: center; }
    input { padding: 6px; margin: 4px 0; width: 200px; }
    button { padding: 6px 14px; margin: 4px 2px; cursor: pointer; }
    .result { margin-top: 10px; padding: 8px; background: #eef; border: 1px solid #99c; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>String Comparison Methods</h1>
    string1: <input type="text" id="string1"><br>
    string2: <input type="text" id="string2"><br>
    <button onclick="compareStrictEquality()">Strict Equality (===)</button>
    <button onclick="compareLength()">Length Comparison</button>
    <button onclick="compareLocale()">localeCompare()</button>
    <button onclick="compareAll()">Compare All</button>
    <div class="result" id="result"></div>

  </div>
  <script src="script.js"></script>
</body>
</html>
