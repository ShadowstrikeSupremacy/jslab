<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 3 - String Operations</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 650px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    h1 { font-size: 22px; text-align: center; }
    h3 { margin-bottom: 5px; }
    .section { border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    input { padding: 6px; margin: 4px 0; width: 180px; }
    button { padding: 6px 14px; margin: 4px 2px; cursor: pointer; }
    .result { margin-top: 8px; padding: 8px; background: #eef; border: 1px solid #99c; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>String Operations</h1>

    <div class="section">
      <h3>1. Reverse String</h3>
      String: <input type="text" id="reverseInput"><br>
      <button onclick="reverseWithMethods()">Using String Methods</button>
      <button onclick="reverseWithoutMethods()">Without String Methods</button>
      <div class="result" id="reverseResult"></div>
    </div>

    <div class="section">
      <h3>2. Replace Characters</h3>
      String: <input type="text" id="replaceInput"><br>
      Replace: <input type="text" id="findChar" placeholder="old character(s)">
      With: <input type="text" id="newChar" placeholder="new character(s)"><br>
      <button onclick="replaceWithMethods()">Using String Methods</button>
      <button onclick="replaceWithoutMethods()">Without String Methods</button>
      <div class="result" id="replaceResult"></div>
    </div>

    <div>
      <h3>3. Check Palindrome</h3>
      String: <input type="text" id="palindromeInput"><br>
      <button onclick="palindromeWithMethods()">Using String Methods</button>
      <button onclick="palindromeWithoutMethods()">Without String Methods</button>
      <div class="result" id="palindromeResult"></div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
