<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exp 1 - Area of Geometric Figures</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    h1 { font-size: 22px; text-align: center; }
    h3 { margin-bottom: 5px; }
    .section { border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    input { padding: 6px; margin: 4px 0; width: 120px; }
    button { padding: 6px 14px; margin: 4px 2px; cursor: pointer; }
    .result { margin-top: 8px; padding: 8px; background: #eef; border: 1px solid #99c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Area of Geometric Figures</h1>

    <div class="section">
      <h3>1. Triangle (Semi-perimeter / Heron's formula)</h3>
      Side a: <input type="number" id="sideA"><br>
      Side b: <input type="number" id="sideB"><br>
      Side c: <input type="number" id="sideC"><br>
      <button onclick="areaOfTriangle()">Calculate</button>
      <div class="result" id="triangleResult"></div>
    </div>

    <div class="section">
      <h3>2. Rectangle</h3>
      Length: <input type="number" id="length"><br>
      Breadth: <input type="number" id="breadth"><br>
      <button onclick="areaOfRectangle()">Calculate</button>
      <div class="result" id="rectangleResult"></div>
    </div>

    <div>
      <h3>3. Circle</h3>
      Radius: <input type="number" id="radius"><br>
      <button onclick="areaOfCircle()">Calculate</button>
      <div class="result" id="circleResult"></div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
